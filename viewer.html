<!doctype html>
<html lang="pt-BR">

<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-7DSEYBWH9H"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-7DSEYBWH9H');

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Visualizador • Centro de Inteligência Gerencial</title>

  <meta name="referrer" content="no-referrer" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css" />

  <style>
    .bg-blur {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(10, 16, 28, 0.38), rgba(10, 16, 28, 0.38)),
        url('img/background.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: blur(4px);
      transform: scale(1.06);
      z-index: -1;
    }

    .bg-glass {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
  </style>
</head>

<body>
  <div class="bg-blur"></div>

  <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <img src="img/logo.png" alt="DR" style="height:28px" />
        <strong>Centro de Inteligência Gerencial</strong>
      </a>
      <div class="ms-auto d-flex align-items-center gap-3">
        <span id="user-chip" class="text-secondary small d-none">—</span>
        <img id="user-avatar" class="avatar-sm d-none" alt="Foto do usuário">
        <button id="btn-logout" class="btn btn-outline-secondary btn-sm d-none">Sair</button>
      </div>
    </div>
  </nav>

  <main class="container-fluid d-flex flex-column px-4 pb-4" style="height: calc(100vh - 58px);">
    <div class="d-flex align-items-center justify-content-between py-3 flex-shrink-0">
      <div class="d-flex align-items-center gap-3">
        <a href="index.html" class="btn btn-outline-secondary btn-sm">← Voltar</a>
      </div>
    </div>

    <div class="card bg-glass shadow-sm flex-grow-1 overflow-hidden">
      <div class="card-body p-0 h-100 position-relative">
        <iframe id="pbi-frame" title="Power BI" src="" class="w-100 h-100 border-0 rounded" allowfullscreen
          referrerpolicy="no-referrer">
        </iframe>

        <div id="not-found" class="position-absolute top-50 start-50 translate-middle text-center d-none">
          <p class="lead mb-1">Relatório não encontrado.</p>
          <p class="text-secondary mb-3">Verifique o link ou volte ao catálogo.</p>
          <a href="index.html" class="btn btn-primary">Voltar ao Catálogo</a>
        </div>
      </div>
    </div>
  </main>

  <script src="assets/auth.local.js"></script>
  <script src="assets/reports.js"></script>
  <script src="assets/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
