<!doctype html>
<html lang="pt-BR">
  <head>
        <!-- Google tag (gtag.js) -->

      function gtag(){dataLayer.push(arguments);}

      gtag('config', 'G-7DSEYBWH9H');

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login • Centro de Inteligência Gerencial</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/login.css" />
    <script src="assets/auth.local.js"></script>
  </head>
  
  <body class="login-body">
    <!-- Fundo com blur + shapes -->
    <div class="bg-layer"></div>
    <div class="shape s1"></div>
    <div class="shape s2"></div>

    <main class="container d-flex justify-content-center align-items-center min-vh-100">
      <div class="glass-card p-4 p-md-5 text-center">
        <img src="img/logo.png" alt="DR Construtora" class="mb-3" style="max-height:70px;" />
        <h1 class="h4 fw-semibold mb-2">Centro de Inteligência Gerencial</h1>
        <p class="text-light-60 small mb-4">Um Portal com Informações para Construirmos o Progresso com Segurança, Agilidade e Eficiência.</p>

        <!-- Botão de login -->
        <form id="form-login" class="text-start">
          <div class="mb-3">
            <label class="form-label">Usuário</label>
            <input type="text" class="form-control" id="inp-user" placeholder="nome.sobrenome" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Senha</label>
            <input type="password" class="form-control" id="inp-pass" placeholder="••••••••" required>
          </div>
          <button class="btn btn-primary btn-lg w-100 rounded-4">Entrar</button>
        </form>


        <!-- Rodapé pequeno -->
        <p class="text-light-60 small mb-0">Seu acesso é auditado para segurança e conformidade.</p>
      </div>
    </main>

    <!-- login.html -->
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        // Se já logado, vai direto para o portal
        if (typeof getSession === 'function' && getSession()) {
          window.location.href = 'index.html';
          return;
        }

        const form = document.getElementById('form-login');
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const user = document.getElementById('inp-user').value.trim();
          const pass = document.getElementById('inp-pass').value;
          try {
            await localLogin(user, pass);   // definido em auth.local.js
            window.location.href = 'index.html';
          } catch (err) {
            alert(err.message || 'Usuário ou senha inválidos');
          }
        });
      });
    </script>
  </body>
</html>
